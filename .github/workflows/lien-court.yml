name: Créer et tester le lien court

# Creates (once) an is.gd short address that redirects to the permanent "latest" download address, so that
# customers type a few characters with the remote instead of the full GitHub address. Then checks, without any
# account, that the short address redirects there and delivers exactly the published APK (http and https).
# The wanted names are read, in order, from lien-court.txt (one per line); the first available one is kept.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lien-court.txt']

permissions:
  contents: read

jobs:
  lien:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Créer ou retrouver le lien court
        run: |
          set -euo pipefail
          TARGET="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/masterzone-tv.apk"
          gh release download --pattern SHA256SUMS.txt --output published.txt
          SHA=$(grep ' masterzone-tv.apk$' published.txt | cut -d' ' -f1)
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::aucune version publiée"; exit 1; }
          KEPT=
          while read -r NAME; do
            [[ "$NAME" =~ ^[A-Za-z0-9_]{5,30}$ ]] || continue
            EXISTING=$(curl -s -o /dev/null -w '%{redirect_url}' "https://is.gd/$NAME" || true)
            if [ "$EXISTING" = "$TARGET" ]; then KEPT=$NAME; echo "is.gd/$NAME existe déjà et pointe vers la bonne adresse"; break; fi
            if [ -n "$EXISTING" ]; then echo "is.gd/$NAME déjà pris (vers une autre adresse)"; continue; fi
            RESPONSE=$(curl -sS --get https://is.gd/create.php --data-urlencode format=json --data-urlencode "url=$TARGET" \
              --data-urlencode "shorturl=$NAME" --data-urlencode logstats=0)
            echo "is.gd/$NAME : $RESPONSE"
            if [ -n "$(jq -r '.shorturl // empty' <<< "$RESPONSE")" ]; then KEPT=$NAME; break; fi
          done < lien-court.txt
          [ -n "$KEPT" ] || { echo "::error title=Lien court::aucun des noms de lien-court.txt n'a pu être créé"; exit 1; }
          echo "NAME=$KEPT" >> "$GITHUB_ENV"; echo "SHA=$SHA" >> "$GITHUB_ENV"; echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Tester le lien court comme un téléviseur (sans compte)
        run: |
          set -euo pipefail
          for SCHEME in http https; do
            LOCATION=$(curl -s -o /dev/null -w '%{redirect_url}' "$SCHEME://is.gd/$NAME")
            [ "$LOCATION" = "$TARGET" ] || { echo "::error::$SCHEME://is.gd/$NAME redirige vers « $LOCATION »"; exit 1; }
            curl -fsSL -A 'Downloader-check' -o "via-$SCHEME.apk" "$SCHEME://is.gd/$NAME"
            echo "$SHA  via-$SCHEME.apk" | sha256sum -c -
          done
          echo "::notice title=Lien court vérifié::is.gd/$NAME → $TARGET ; en http et https, APK téléchargé identique (SHA-256 $SHA)"
